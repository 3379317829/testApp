<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>掌上猪科 · 校园活动与机会</title>
<meta name="description" content="掌上猪科 —— 把校园活动与机会整理成「今天能做什么、我够不够格、什么时候截止、信息靠不靠谱」。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐷</text></svg>">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-logo" aria-hidden="true">🐷</span>
      <span class="brand-text">
        <strong>掌上猪科</strong>
        <small>校园里的活动、比赛、招募，一处看全</small>
      </span>
    </div>
    <button class="profile-btn" id="profileBtn" type="button" title="账号与设置">
      <span id="userLabel">未登录</span>
    </button>
  </div>
</header>

<main class="wrap">

  <section class="notice" id="dataNotice">
    下面的状态都是按今天（<time id="nowLabel">2026-09-19</time>）现算的：哪个在报名、哪个快截止、哪个已经过了。
    <span class="notice-dim">这些信息来自考核给的模拟材料，不是学校的真实通知。</span>
  </section>

  <section class="stats" id="stats" aria-label="今日概览"></section>

  <section class="panel" aria-label="筛选">
    <div class="quickbar" id="quickbar"></div>
    <div class="filterbar">
      <label class="search">
        <span aria-hidden="true">🔍</span>
        <input id="q" type="search" placeholder="搜活动、招募、关键词，比如 Git、志愿、零基础" autocomplete="off">
      </label>
      <div class="selects">
        <select id="cat" aria-label="分类">
          <option value="">全部分类</option>
        </select>
        <select id="src" aria-label="来源">
          <option value="">全部来源</option>
        </select>
      </div>
    </div>
    <div class="filterbar-foot">
      <span id="resultCount" class="count">共 26 条</span>
      <label class="switch">
        <input type="checkbox" id="fitOnly">
        <span>只看我能参加的</span>
      </label>
      <button class="link-btn" id="resetFilter" type="button">重置</button>
    </div>
  </section>

  <section id="list" class="list" aria-live="polite"></section>

  <section id="minePanel" class="panel hidden">
    <h2 class="panel-title">我的收藏和报名</h2>
    <div id="mineBody"></div>
  </section>

  <section id="publishPanel" class="panel hidden">
    <h2 class="panel-title">发个活动 / 招个人</h2>
    <div id="publishBody"></div>
  </section>

  <section id="adminPanel" class="panel hidden">
    <h2 class="panel-title">后台管理</h2>
    <div id="adminBody"></div>
  </section>

  <footer class="foot">
    <p>掌上猪科 · 珠海科技学院计算机协会软件部 2026 秋季纳新第二轮考核作品</p>
    <p class="foot-dim">材料为考核模拟信息，不代表学校真实通知</p>
  </footer>
</main>

<nav class="tabbar" id="tabbar">
  <button class="tab is-active" data-view="discover" type="button"><span aria-hidden="true">🧭</span>发现</button>
  <button class="tab" data-view="publish" type="button"><span aria-hidden="true">📣</span>发布</button>
  <button class="tab" data-view="mine" type="button"><span aria-hidden="true">⭐</span>我的<span class="badge-dot" id="mineDot"></span></button>
  <button class="tab hidden" data-view="admin" id="tabAdmin" type="button"><span aria-hidden="true">🛠️</span>后台</button>
</nav>

<!-- 登录页：未登录时整页展示 -->
<section class="login" id="loginView" hidden>
  <div class="login-card">
    <div class="login-brand"><span aria-hidden="true">🐷</span> 掌上猪科</div>
    <p class="login-sub">校园活动与机会 · 账号登录</p>

    <form id="loginForm" autocomplete="off">
      <div class="field-row">
        <label for="loginUser">用户名</label>
        <input id="loginUser" type="text" placeholder="请输入用户名" autocomplete="username">
      </div>
      <div class="field-row">
        <label for="loginPass">密码</label>
        <input id="loginPass" type="password" placeholder="请输入密码" autocomplete="current-password">
      </div>
      <p class="login-err" id="loginErr" hidden></p>
      <button class="btn primary" id="loginSubmit" type="submit">登录</button>
    </form>

    <div class="login-demo">
      <div class="login-demo-title">演示账号（点击自动填入）</div>
      <button type="button" class="demo-item" data-fill="admin">
        <b>管理员</b>
        <span>admin / admin123</span>
        <em>登录后可进入后台</em>
      </button>
      <button type="button" class="demo-item" data-fill="student">
        <b>学生</b>
        <span>zhuke / 123456</span>
        <em>林晓 · 学号 20260101</em>
      </button>
      <p class="login-note">
        本功能为本地演示：账号绑定学号、采用实名制，账号数据仅用于展示登录、实名发布与后台管理流程，
        不做真实身份校验，也不与学校系统对接。
      </p>
    </div>
  </div>
</section>

<!-- 活动详情弹层 -->
<div class="sheet-mask" id="sheetMask" hidden></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="活动详情" hidden>
  <div class="sheet-head">
    <div class="sheet-grip" aria-hidden="true"></div>
    <button class="sheet-close" id="sheetClose" type="button" aria-label="关闭">✕</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</aside>

<!-- 账号弹层 -->
<aside class="sheet" id="accountSheet" role="dialog" aria-modal="true" aria-label="我的账号" hidden>
  <div class="sheet-head">
    <div class="sheet-grip" aria-hidden="true"></div>
    <button class="sheet-close" id="accountClose" type="button" aria-label="关闭">✕</button>
  </div>
  <div class="sheet-body" id="accountBody"></div>
</aside>

<!-- 我的情况弹层 -->
<aside class="sheet" id="profileSheet" role="dialog" aria-modal="true" aria-label="我的情况" hidden>
  <div class="sheet-head">
    <div class="sheet-grip" aria-hidden="true"></div>
    <button class="sheet-close" id="profileClose" type="button" aria-label="关闭">✕</button>
  </div>
  <div class="sheet-body" id="profileBody"></div>
</aside>

<div class="toast" id="toast" hidden></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/account.js"></script>
<script src="assets/js/engine.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/detail.js"></script>
<script src="assets/js/mine.js"></script>
<script src="assets/js/publish.js"></script>
<script src="assets/js/admin.js"></script>
<script>ZHUKE.boot();</script>
</body>
</html>
